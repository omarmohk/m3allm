<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المعلم</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}body{background:#121212;color:#e8eaed}.top{height:56px;background:#202124;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #3c4043;position:sticky;top:0;z-index:30}.cities{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.cityCard{background:#202124;border:1px solid #3c4043;border-radius:12px;padding:14px;text-align:center;cursor:pointer}.cityHeader{height:56px;background:#202124;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid #3c4043}.back{background:#3c4043;border:0;color:#fff;padding:8px 12px;border-radius:20px}.search{flex:1;padding:9px 12px;border-radius:20px;border:1px solid #3c4043;background:#121212;color:#fff}.btnNear{background:#8ab4f8;color:#202124;border:0;padding:9px 14px;border-radius:20px;font-weight:700;font-size:12px}.grid{overflow:auto;height:calc(100vh - 176px)}table{border-collapse:collapse;min-width:1050px;width:100%;background:#121212}th,td{border:1px solid #3c4043;padding:7px 5px;font-size:11px;text-align:center;white-space:nowrap}th{background:#202124;position:sticky;top:0}.num{background:#202124;color:#5f6368;width:40px;min-width:40px;position:sticky;right:0}td.imgCell img{width:48px;height:48px;border-radius:8px;object-fit:cover}.call{padding:6px 9px;border-radius:20px;border:0;font-size:11px;font-weight:700;margin:1px}.c1{background:#8ab4f8;color:#202124}.c2{background:#25D366;color:#fff}.bottom{height:60px;background:#202124;display:flex;align-items:center;justify-content:space-between;padding:0 12px;position:fixed;bottom:0;width:100%;border-top:1px solid #3c4043}.btnAdd{background:#8ab4f8;color:#202124;border:0;padding:12px 20px;border-radius:24px;font-weight:800}.modal{display:none;position:fixed;inset:0;background:#000d;z-index:99;align-items:center;justify-content:center;padding:14px}.modal.a{display:flex}.box{background:#202124;border:1px solid #3c4043;border-radius:16px;padding:16px;width:100%;max-width:400px}.box input,.box select{width:100%;padding:12px;margin:5px 0;border-radius:12px;border:1px solid #3c4043;background:#121212;color:#fff}.btnSave{background:#8ab4f8;color:#202124;border:0;padding:13px;border-radius:12px;width:100%;font-weight:800;margin-top:10px}.hidden{display:none!important}.preview{width:100%;height:140px;border:1px dashed #3c4043;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:6px 0;overflow:hidden;background:#121212}.preview img{width:100%;height:100%;object-fit:cover}</style></head><body><div class="top"><div><b>🔧 المعلم</b><br><small style="color:#8ab4f8">من طنجة للكويرة</small></div><div><button class="btnNear" onclick="getLocation()">📍 موقعي</button></div></div><div id="pageCities"><div style="padding:10px"><input id="searchCity" placeholder="قلب: جرسيف..." oninput="renderCities()" style="width:100%;padding:12px;border-radius:24px;border:1px solid #3c4043;background:#202124;color:#fff"></div><div id="citiesGrid" class="cities"></div></div><div id="pageTable" class="hidden"><div class="cityHeader"><button class="back" onclick="goBack()">⬅</button><b id="cityName"></b><input id="q" class="search" placeholder="قلب مهنة..." oninput="renderTable()"><button class="btnNear" onclick="sortNear()">قريب</button></div><div class="grid"><table><thead><tr><th class="num">#</th><th>صورة</th><th>الاسم</th><th>المهنة</th><th>الهاتف</th><th>واتساب</th><th>المسافة</th><th>اتصال</th></tr></thead><tbody id="tb"></tbody></table></div><div class="bottom"><div style="font-size:11px;color:#9aa0a6" id="cityInfo"></div><button class="btnAdd" onclick="openAdd()">+ زيد خدمتك</button></div></div><div class="modal" id="modal"><div class="box"><h3 style="text-align:center">سجل فـ <span id="modalCity"></span></h3><input id="mName" placeholder="الاسم"><select id="mJob"><option>ميكانيك</option><option>كهربائي</option><option>بلومبي</option><option>بناي</option><option>صباغ</option><option>نجار</option><option>حداد</option><option>كليماتيزور</option><option>زليجي</option><option>جباص</option><option>ألمنيوم</option><option>سائق</option><option>حلاق</option><option>مهنة أخرى</option></select><input id="mPhone" type="tel" placeholder="الهاتف 06..."><input id="mWhat" type="tel" placeholder="واتساب"><div class="preview" id="preview"><span style="color:#5f6368">📸 صورة الخدمة</span></div><input type="file" id="mImage" accept="image/*" style="display:none" onchange="loadImage(event)"><button style="width:100%;padding:8px;border-radius:8px;border:1px solid #3c4043;background:#121212;color:#8ab4f8" onclick="document.getElementById('mImage').click()">📷 اختار صورة</button><div style="margin-top:8px;font-size:11px;color:#9aa0a6">📍 <span id="locStatus">GPS تلقائي</span></div><button class="btnSave" onclick="save()">حفظ ✅</button><button onclick="closeAdd()" style="width:100%;margin-top:8px;background:transparent;border:0;color:#9aa0a6;padding:8px">إلغاء</button></div></div><script>const allCities=["طنجة","تطوان","الحسيمة","الناظور","وجدة","بركان","جرسيف","تازة","فاس","مكناس","القنيطرة","الرباط","سلا","الدار البيضاء","المحمدية","الجديدة","سطات","بني ملال","خنيفرة","مراكش","آسفي","الصويرة","ورزازات","الرشيدية","أكادير","تزنيت","كلميم","طانطان","العيون","الداخلة","الكويرة","الخميسات","سيدي قاسم","العرائش","شفشاون","تاوريرت","الدريوش","جرادة","فكيك","ميدلت","أزيلال","قلعة السراغنة","اليوسفية","شيشاوة","تارودانت","طاطا","سيدي إفني","بوجدور","السمارة","أوسرد","زاكورة","تنغير","بولمان","صفرو","مولاي يعقوب","إفران","الحاجب"];let currentCity=null,myLat=null,myLng=null,tempImg=null,sortByNear=false;let DB=JSON.parse(localStorage.getItem('m3allemV6')||'{}');function getCityData(c){if(!DB[c])DB[c]=[];return DB[c];}function renderCities(){let q=(searchCity.value||'').toLowerCase();let h='';allCities.filter(c=>c.toLowerCase().includes(q)).forEach(c=>{let count=getCityData(c).length;h+=`<div class="cityCard" onclick="openCity('${c}')"><b>📍 ${c}</b><br><span>${count} معلم</span><br><small style="color:#8ab4f8">دخل ⬅</small></div>`});citiesGrid.innerHTML=h;}function openCity(c){currentCity=c;pageCities.classList.add('hidden');pageTable.classList.remove('hidden');cityName.innerText=c;modalCity.innerText=c;cityInfo.innerText='جدول '+c+' - '+getCityData(c).length+' معلم';renderTable();}function goBack(){pageTable.classList.add('hidden');pageCities.classList.remove('hidden');renderCities();}function calcDist(lat1,lon1,lat2,lon2){if(!lat1||!lat2)return null;let R=6371;let dLat=(lat2-lat1)*Math.PI/180;let dLon=(lon2-lon1)*Math.PI/180;let a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);let c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));return R*c;}function renderTable(){let q=(document.getElementById('q').value||'').toLowerCase();let data=[...getCityData(currentCity)];if(sortByNear&&myLat){data.sort((a,b)=>{let da=calcDist(myLat,myLng,a.lat,a.lng)||9999;let db=calcDist(myLat,myLng,b.lat,b.lng)||9999;return da-db;});}let filtered=data.filter(d=>(d.name+d.job+d.phone).toLowerCase().includes(q));let h='';filtered.forEach((d,i)=>{let dist='';if(myLat&&d.lat){let km=calcDist(myLat,myLng,d.lat,d.lng);dist=km<1?(km*1000).toFixed(0)+'م':km.toFixed(1)+'كم';}else if(d.lat)dist='📍';else dist='-';let img=d.img?`<img src="${d.img}">`:`<span style="font-size:20px">👷</span>`;h+=`<tr><td class="num">${i+1}</td><td class="imgCell">${img}</td><td><b>${d.name}</b></td><td>${d.job}</td><td>${d.phone}</td><td>${d.what}</td><td>${dist}</td><td><button class="call c1" onclick="location.href='tel:${d.phone}'">📞</button><button class="call c2" onclick="window.open('https://wa.me/212${d.what.replace(/^0/,'')}','_blank')">واتس</button></td></tr>`});if(filtered.length==0)h=`<tr><td colspan="8" style="padding:30px;color:#888">ما كاين حتى معلم فـ ${currentCity}<br><br><button class="btnAdd" onclick="openAdd()">+ كون أول واحد</button></td></tr>`;tb.innerHTML=h;}function getLocation(){if(!navigator.geolocation){alert('GPS ما خدامش');return}locStatus.innerText='جاري التحديد...';navigator.geolocation.getCurrentPosition(p=>{myLat=p.coords.latitude;myLng=p.coords.longitude;locStatus.innerText=`تم: ${myLat.toFixed(4)} ✅`;renderTable();},()=>{locStatus.innerText='رفضت';});}function sortNear(){if(!myLat){getLocation();return}sortByNear=!sortByNear;renderTable();}function openAdd(){modal.classList.add('a');tempImg=null;preview.innerHTML='<span style="color:#5f6368">📸 صورة الخدمة</span>';if(!myLat)getLocation();}function closeAdd(){modal.classList.remove('a');}function loadImage(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=function(ev){tempImg=ev.target.result;preview.innerHTML=`<img src="${tempImg}">`;};r.readAsDataURL(file);}function save(){let n=mName.value.trim(),p=mPhone.value.trim(),w=mWhat.value.trim()||p,j=mJob.value;if(!n||!p){alert('عمر الاسم والنمرة');return}getCityData(currentCity).push({name:n,job:j,phone:p,what:w,img:tempImg,lat:myLat,lng:myLng});localStorage.setItem('m3allemV6',JSON.stringify(DB));closeAdd();mName.value='';mPhone.value='';mWhat.value='';tempImg=null;renderTable();}renderCities();</script></body></html>
